name: Sync portfolio from ArtStation

on:
  schedule:
    - cron: "0 5 * * *" # daily, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync
        run: node sync/sync.mjs --thumbs

      - name: Commit if changed
        run: |
          git config user.name "portfolio-sync"
          git config user.email "actions@github.com"
          git add site/data/portfolio.json site/assets/thumbs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "sync: portfolio data $(date -u +%Y-%m-%d)"
            git push
          fi
